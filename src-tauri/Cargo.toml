[package]
name = "defaultmd"
version = "0.1.0"
description = "defaultMD - lightweight Markdown viewer/editor for Windows"
authors = ["defaultMD"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "defaultmd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }

# 경량화: 바이너리 크기 최소화 (PLAN.md 4장)
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
